<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Tracker · Signal Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F6F4A'/%3E%3Ctext x='32' y='42' font-size='26' font-weight='bold' text-anchor='middle' fill='white' font-family='Helvetica'%3ETR%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#ffffff;--soft:#F9FAFB;--soft2:#F3F4F6;--line:#E5E7EB;--line2:#D1D5DB;--ink:#111827;--mute:#6B7280;--mute2:#9CA3AF;
--brand:#1F6F4A;--brand2:#E8F3EE;--good:#15803D;--goodbg:#ECFDF3;--warn:#B45309;--warnbg:#FFFBEB;--bad:#B91C1C;--badbg:#FEF2F2;
--font:Helvetica,"Helvetica Neue",Arial,sans-serif;--mono:"SF Mono",Menlo,Consolas,monospace;--r:12px;
--shadow:0 1px 2px rgba(17,24,39,.04),0 1px 8px rgba(17,24,39,.04)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;font:700 13px var(--font);display:flex;align-items:center;justify-content:center}
.brandname{font-weight:700;font-size:15px;line-height:1.1}.brandsub{font-size:11px;color:var(--mute)}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:12px}
nav button{white-space:nowrap;background:none;border:0;border-radius:8px;padding:8px 12px;color:var(--mute);font:500 13px var(--font);cursor:pointer}
nav button:hover{background:var(--soft2);color:var(--ink)}nav button.on{background:var(--brand2);color:var(--brand);font-weight:700}
.actions{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;font:600 13px var(--font);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:12px}.btn:disabled{opacity:.6;cursor:wait}
main{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;letter-spacing:-.2px}h2{font-size:15px;margin-bottom:12px}.lead{color:var(--mute);margin:4px 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--soft)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:20px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:#fff}
.kpi .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font:700 22px var(--font);margin-top:4px;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.kpi.hero{background:var(--brand);border-color:var(--brand);color:#fff}.kpi.hero .l,.kpi.hero .s{color:rgba(255,255,255,.82)}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}.rows>span:nth-child(odd){color:var(--mute)}
.rows>span:nth-child(even){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.verdict{margin-top:12px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font:700 11px var(--font)}
.OK{background:var(--goodbg);color:var(--good)}.WARN{background:var(--warnbg);color:var(--warn)}.CRITICAL,.BREACHED{background:var(--badbg);color:var(--bad)}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px}.banner.bad{background:var(--badbg);color:var(--bad);border:1px solid #FECACA}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:var(--soft)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}.scroll{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px}
.scroll table th{position:sticky;top:0}.scroll tr:last-child td{border-bottom:0}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 14px}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute);font-weight:500}
.star{color:var(--brand)}
input,select,textarea{background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;font:14px var(--font);transition:border-color .15s,box-shadow .15s;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand2)}
textarea{min-height:64px;resize:vertical}.wide{grid-column:1/-1}
details.more{grid-column:1/-1;border-top:1px dashed var(--line2);padding-top:10px}
details.more>summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:13px}
details.more .f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 14px;margin-top:12px}
details.sec{border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;background:#fff;margin-top:16px}
details.sec>summary{cursor:pointer;font-weight:700}details.sec[open]>summary{margin-bottom:14px}
.formfoot{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.preview{font-size:13px;color:var(--mute)}.preview b{color:var(--ink)}
.pos{color:var(--good)!important}.neg{color:var(--bad)!important}
.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft2);margin:4px 0 12px}
.alloc span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:12px;color:var(--mute);margin-bottom:16px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
#toast{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:380px}
.toast.err{background:var(--bad)}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.kpi.hero{grid-column:1/-1}.kpi .v{font-size:18px}main{padding:16px 14px 60px}nav{margin-left:0;width:100%;overflow:auto;flex-wrap:nowrap}.actions{margin-left:0}.g2{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="bar">
  <div class="logo">TR</div>
  <div><div class="brandname">Trading Tracker</div><div class="brandsub">GIVONDO Trading OS</div></div>
  <nav id="tabs"></nav>
  <div class="actions">
    <a class="btn pri" href="/api/tracker/workbook.xlsx" title="Excel workbook with live formulas, rebuilt from your records">⬇ Download Excel</a>
    <a class="btn" href="/">Desk</a>
  </div>
</div></header>
<main id="app"><div class="empty">Loading…</div></main>
<div id="toast"></div>

<script>
"use strict";
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const fmt = (v, d=2) => v === null || v === undefined || v === "" ? "n/a" : (isNum(v) ? v.toLocaleString("en-GB",{maximumFractionDigits:d}) : esc(v));
const kes = v => isNum(v) ? "KES " + Math.round(v).toLocaleString("en-GB") : "n/a";
const pct = v => isNum(v) ? (v*100).toFixed(1) + "%" : "n/a";
const sign = v => isNum(v) ? (v > 0 ? "pos" : v < 0 ? "neg" : "") : "";
const ccyList = o => Object.entries(o||{}).map(([a,b])=>a+" "+fmt(b)).join(", ") || "n/a";
const sel = opts => ({type:"select", opts});
const N = {type:"number"}, DT = {type:"datetime"}, D = {type:"date"}, TA = {type:"textarea"};
const CORE = {core:true};
const today = () => new Date().toISOString().slice(0,10);
const EMOTIONS = ["","Calm","Confident","Fearful","Greedy","Impatient","FOMO","Revenge","Hesitant","Overconfident","Fatigued"];
const SESSIONS = ["","Asian","London","Overlap","New York"];
const METHODS = ["","M-Pesa","Bank transfer","Card","Stablecoin","Other"];
const NW_CATS = ["CASH","EMERGENCY_FUND","INVESTMENTS","TRADING_ACCOUNT","BUSINESS_EQUITY","PROPERTY","VEHICLE","RECEIVABLE","OTHER_ASSET","LOAN","CREDIT_CARD","MOBILE_LOAN","OTHER_LIABILITY"];
const CAT_COL = {CASH:"#1F6F4A",EMERGENCY_FUND:"#4FA67F",INVESTMENTS:"#2563EB",TRADING_ACCOUNT:"#D97706",BUSINESS_EQUITY:"#7C3AED",PROPERTY:"#0E7490",VEHICLE:"#64748B",RECEIVABLE:"#A3A3A3",OTHER_ASSET:"#9CA3AF"};

// Field specs mirror the Trading OS CSV templates. "*" = required; core = shown before "More details".
const FORMS = {
  trades: {fields:[
    ["account_type*", sel(["PERSONAL","PROP","DEMO","PAPER"])], ["instrument*",{def:"XAUUSD"}], ["direction*", sel(["BUY","SELL"])],
    ["setup",{def:"S-001",...CORE}], ["entry_price*",N], ["stop_loss*",N], ["exit_price*",N], ["initial_risk_amount*",N],
    ["net_pl*",N], ["rule_compliance*", sel(["FOLLOWED","VIOLATED"])], ["violation_detail",CORE], ["emotional_state",{...sel(EMOTIONS),...CORE}],
    ["account_label"], ["firm_or_broker"], ["strategy_id",{def:"S-001"}], ["timeframe",{def:"M15"}], ["session", sel(SESSIONS)],
    ["entry_time_utc",DT], ["exit_time_utc",DT], ["take_profit",N], ["volume",N], ["currency",{def:"USD"}],
    ["gross_pl",N], ["commission",N], ["swap",N], ["screenshot_before"], ["screenshot_after"], ["market_conditions",TA], ["lessons",TA]]},
  missed: {fields:[["instrument*",{def:"XAUUSD"}],["direction",sel(["","BUY","SELL"])],["setup",CORE],["reason_missed*",TA],
    ["date_utc",DT],["account_label"],["strategy_id"],["planned_entry",N],["planned_stop",N],["planned_target",N],["hypothetical_r",N],["emotional_state"],["lesson",TA]]},
  violations: {fields:[["rule_broken*"],["description*",TA],["cost_amount",{...N,...CORE}],
    ["date_utc",DT],["trade_id"],["account_label"],["currency",{def:"USD"}],["emotional_state"],["trigger"],["corrective_action",TA]]},
  corrections: {fields:[["trade_id*"],["field*"],["corrected_value*"],["reason*",TA],["original_value"],["evidence"]]},
  psychology: {fields:[["date*",{...D,def:today()}],["session",{...sel(SESSIONS),...CORE}],["sleep_hours",{...N,...CORE}],
    ...["energy","stress","fear","greed","impatience","fomo","overconfidence","fatigue","hesitation"].map(k=>[k+"_1_5",{...sel(["","1","2","3","4","5"]),...CORE}]),
    ["overtrading_flag",{...sel(["","N","Y"]),...CORE}],["revenge_trading_flag",{...sel(["","N","Y"]),...CORE}],["trades_taken",{...N,...CORE}],["rule_violations",{...N,...CORE}],["notes",{...TA,...CORE}]]},
  evaluations: {fields:[["account_label*",{ph:"FTMO-2S-10K-01"}],["firm*"],["programme*"],
    ["purchase_type*",sel(["CHALLENGE","RESET","ADDON"])],["nominal_size*",N],["purchase_date*",{...D,def:today()}],
    ["fee_paid*",N],["fee_currency*",sel(["USD","EUR","GBP"])],["status*",sel(["PURCHASED","EVALUATION","PASSED","FAILED","FUNDED","CLOSED"])],
    ["fx_rate_to_kes",{...N,...CORE}],["platform",{def:"MT5"}],["fee_kes",N],["fx_rate_source",sel(["","ACTUAL","ESTIMATED"])],
    ["payment_method"],["stage",sel(["","Phase 1","Phase 2","Funded"])],["profit_target_pct",N],["daily_loss_pct",N],["max_loss_pct",N],
    ["max_loss_mode",sel(["","static","trailing_eod","trailing_intraday"])],["closed_date",D],["outcome_reason"],["fee_refund_received",N],["rules_verified_on",D],["notes",TA]]},
  snapshots: {fields:[["account_label*"],["rules_preset*",{type:"preset"}],
    ["stage*",sel(["EVALUATION","PASSED","FUNDED","PAYOUT ELIGIBLE","FAILED","CLOSED"])],["initial_balance*",N],["equity*",N],
    ["day_start_balance*",N],["highest_eod_balance",{...N,...CORE}],["firm"],["trading_days_completed",N],["profit_target_progress_pct",N],
    ["consistency_status"],["payout_eligible",sel(["","N","Y"])],["notes",TA]]},
  payouts: {fields:[["account_label*"],["firm*"],["requested_date*",{...D,def:today()}],
    ["amount_requested*",N],["currency*",sel(["USD","EUR"])],["status*",sel(["REQUESTED","APPROVED","RECEIVED","DENIED"])],
    ["amount_received",{...N,...CORE}],["fx_rate_to_kes",{...N,...CORE}],["status_date",D],["received_date",D],["gross_simulated_profit",N],["profit_split_pct",N],
    ["method",sel(["","Rise","Bank","Crypto","Wise","Card","Other"])],["payout_fees",N],["kes_received",N],["fx_rate_source",sel(["","ACTUAL","ESTIMATED"])],["reference"],["evidence"],["notes",TA]]},
  networth: {fields:[["item*",{list:"nwitems",ph:"e.g. Emergency MMF"}],["category*",sel(NW_CATS)],
    ["amount*",{...N,ph:"positive, also for debts"}],["currency*",sel(["KES","USD","EUR","GBP"])],["fx_rate_to_kes",{...N,...CORE,def:"1"}],
    ["date*",{...D,def:today()}],["liquid",{...sel(["Y","N"]),...CORE}],["fx_rate_source",sel(["","ACTUAL","ESTIMATED"])],["notes",TA]]},
  deposits: {fields:[["date*",{...D,def:today()}],["account*"],["amount*",N],["currency*",sel(["USD","KES","EUR"])],
    ["fx_rate_to_kes",{...N,...CORE}],["fx_rate_source*",sel(["ACTUAL","ESTIMATED"])],["payment_method",{...sel(METHODS),...CORE}],
    ["reference",CORE],["transaction_type",{def:"DEPOSIT"}],["kes_equivalent",N],["charges",N],["charges_currency",{def:"KES"}],["evidence"],["notes",TA]]},
  withdrawals: {fields:[["date*",{...D,def:today()}],["account*"],["amount*",N],["currency*",sel(["USD","KES","EUR"])],
    ["fx_rate_to_kes",{...N,...CORE}],["fx_rate_source*",sel(["ACTUAL","ESTIMATED"])],["payment_method",{...sel(METHODS),...CORE}],
    ["reference",CORE],["transaction_type",{def:"WITHDRAWAL"}],["kes_equivalent",N],["charges",N],["charges_currency",{def:"KES"}],["evidence"],["notes",TA]]},
  accounts: {fields:[["account*"],["broker*"],["base_currency*",sel(["USD","KES","EUR"])],["regulator_and_licence",CORE],
    ["opening_capital",{...N,...CORE}],["opened_date",{...D,...CORE}],["account_type",sel(["","Standard","Raw"])],["platform",{def:"MT5"}],["status",{def:"OPEN"}],["notes",TA]]},
  reconciliation: {fields:[["period_end*",D],["account*"],["opening_equity*",N],["closing_equity_statement*",N],
    ["deposits",{...N,...CORE}],["withdrawals",{...N,...CORE}],["realised_pl",{...N,...CORE}],["commissions",{...N,...CORE}],["swaps",{...N,...CORE}],
    ["currency",{def:"USD"}],["unrealised_pl_change",N],["other_charges",N],["reconciled",sel(["N","Y"])],["max_drawdown_pct_to_date",N],["notes",TA]]},
};

const TABS = [["overview","Overview"],["journal","Journal"],["prop","Prop firms"],["networth","Net worth"],["capital","Capital"],["psych","Psychology"],["tools","Tools"],["records","Records"]];
let S = null, tab = (location.hash.slice(1) || "overview");

function toast(msg, err){ const t = document.createElement("div"); t.className = "toast" + (err?" err":""); t.textContent = msg;
  document.getElementById("toast").appendChild(t); setTimeout(()=>t.remove(), err?6000:3500); }
async function api(path, body){
  try{
    const r = await fetch(path, body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {});
    const j = await r.json().catch(()=>({ok:false,error:"Unexpected response"}));
    if(!r.ok && j.ok !== false) j.ok = false;
    return j;
  }catch(e){ return {ok:false,error:"Network error: is the desk running?"}; }
}
async function load(){
  S = await api("/api/tracker/summary");
  if(S && S.ok !== false){ const r = await api("/api/tracker/records?kind=trades&limit=20"); S._recent = r.rows || []; }
  render();
}

// ---------------------------------------------------------------- forms
function field([nameSpec, spec={}]){
  const req = nameSpec.endsWith("*"), name = nameSpec.replace("*","");
  const LABELS = {net_pl:"Net P/L",gross_pl:"Gross P/L",fx_rate_to_kes:"FX rate to KES",fx_rate_source:"FX rate source",kes_equivalent:"KES equivalent",
    fee_kes:"Fee in KES",kes_received:"KES received",initial_risk_amount:"Money at risk",rules_preset:"Firm rules",realised_pl:"Realised P/L",
    unrealised_pl_change:"Unrealised P/L change",closing_equity_statement:"Closing equity (statement)",max_drawdown_pct_to_date:"Max drawdown % to date",
    regulator_and_licence:"Regulator and licence",profit_target_progress_pct:"Profit target progress %",highest_eod_balance:"Highest end-of-day balance",
    hypothetical_r:"Hypothetical R",account_label:"Account",stop_loss:"Stop loss",sleep_hours:"Sleep (hours)"};
  let lab = LABELS[name] || name.replace(/_1_5$/," (1 to 5)").replace(/_/g," ");
  if(spec.type==="datetime") lab = lab.replace(/ utc$/,"") + " (your time)";
  lab = lab.charAt(0).toUpperCase() + lab.slice(1);
  let input;
  if(spec.type==="select") input = `<select name="${name}">${spec.opts.map(o=>`<option${o===spec.def?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(spec.type==="preset") input = `<select name="${name}">${Object.entries(S.presets).map(([k,p])=>`<option value="${esc(k)}">${esc(p.firm)} · ${esc(p.programme)}${p.kenya_eligible===false?" (not for Kenya)":""}</option>`).join("")}</select>`;
  else if(spec.type==="textarea") input = `<textarea name="${name}" placeholder="${esc(spec.ph||"")}"></textarea>`;
  else { const t = {number:"number",date:"date",datetime:"datetime-local"}[spec.type] || "text";
    input = `<input name="${name}" type="${t}" ${t==="number"?'step="any" inputmode="decimal"':""} value="${esc(spec.def||"")}" placeholder="${esc(spec.ph||"")}" data-kind="${spec.type||""}" ${spec.list?`list="${spec.list}"`:""} ${req?"required":""}>`; }
  return `<label class="${spec.type==="textarea"?"wide":""}"><span>${esc(lab)}${req?' <b class="star">*</b>':""}</span>${input}</label>`;
}
function formHtml(kind, opts={}){
  const f = FORMS[kind], core = f.fields.filter(x=>x[0].endsWith("*")||(x[1]||{}).core), more = f.fields.filter(x=>!core.includes(x));
  return `<form class="f" data-kind="${kind}">${core.map(field).join("")}
    ${more.length?`<details class="more"><summary>More details (${more.length} optional)</summary><div class="f2">${more.map(field).join("")}</div></details>`:""}
    <div class="formfoot"><button class="btn pri" type="submit">${esc(opts.button||"Save")}</button>
    ${opts.preview?'<span class="preview" data-preview></span>':""}</div></form>`;
}
function card(title, inner, sub){ return `<div class="card"><h2>${esc(title)}</h2>${sub?`<p class="lead" style="margin-top:-6px">${sub}</p>`:""}${inner}</div>`; }
async function submitForm(e){
  e.preventDefault();
  const form = e.target, kind = form.dataset.kind, row = {};
  for(const el of form.elements){
    if(!el.name) continue;
    let v = el.value.trim();
    if(el.dataset.kind==="datetime" && v) v = new Date(v).toISOString().replace(".000Z","+00:00");
    if(v !== "") row[el.name] = v;
  }
  const btn = form.querySelector("button[type=submit]"); btn.disabled = true;
  const r = await api("/api/tracker/append", {kind, row}); btn.disabled = false;
  if(r.ok){ toast("Saved " + (r.row.trade_id||r.row.entry_id||r.row.record_id||r.row.snapshot_id||r.row.payout_id||r.row.txn_id||"")); await load(); }
  else toast(r.error || "Not saved", true);
}
function tradePreview(form){
  const g = n => parseFloat(form.elements[n]?.value), out = form.querySelector("[data-preview]");
  const e = g("entry_price"), s = g("stop_loss"), x = g("exit_price"), risk = g("initial_risk_amount"), net = g("net_pl"), dir = form.elements.direction.value;
  const parts = [];
  if(isFinite(e)&&isFinite(s)){ const bad = dir==="BUY" ? s>=e : s<=e; parts.push(bad ? `<span class="neg">Stop is on the wrong side for a ${dir}</span>` : `Stop distance <b>${Math.abs(e-s).toFixed(2)}</b>`); }
  if(isFinite(e)&&isFinite(s)&&isFinite(x)&&e!==s) parts.push(`Price move <b>${((dir==="BUY"?x-e:e-x)/Math.abs(e-s)).toFixed(2)}R</b>`);
  if(isFinite(net)&&isFinite(risk)&&risk>0) parts.push(`Logged result <b class="${sign(net)}">${(net/risk).toFixed(2)}R</b>`);
  out.innerHTML = parts.join(" · ");
}

// ---------------------------------------------------------------- pieces
const kpi = (l, v, s, cls="") => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
function kpis(){
  const nw = S.net_worth, t = S.trades, pe = S.prop_economics, live = t.personal.metrics, prac = t.practice.metrics;
  const propKes = (pe.payouts_received_kes||0) - (pe.fees_paid_kes||0);
  return `<div class="kpis">
    ${kpi("Net worth", kes(nw.net_worth_kes), `Liquid ${kes(nw.liquid_net_worth_kes)}`, "hero")}
    ${kpi("Live expectancy", live.n ? fmt(live.expectancy_r,2)+"R" : "n/a", live.n ? `${live.n} personal trades` : "No live trades yet")}
    ${kpi("Practice expectancy", prac.n ? fmt(prac.expectancy_r,2)+"R" : "n/a", prac.n ? `${prac.n} paper and demo trades` : "Paper trades sync automatically")}
    ${kpi("Prop cash result", kes(propKes), `Fees ${kes(pe.fees_paid_kes)} · received ${kes(pe.payouts_received_kes)}`)}
    ${kpi("Rule compliance", S.compliance.trades ? pct(S.compliance.compliance_rate) : "n/a", `${S.compliance.violations||0} violations`)}
  </div>`;
}
function metricsCard(title, m, unit){
  if(!m || !m.n) return card(title, `<div class="empty">No trades recorded yet.</div>`);
  const rows = [["Trades",m.n],["Win rate",pct(m.win_rate)],["Expectancy per trade", fmt(m.expectancy_per_trade)+(unit?" "+unit:"")],["Expectancy (R)",fmt(m.expectancy_r,3)],
    ["Lower 95% bound (R)",fmt(m.expectancy_r_lower95,3)],["Profit factor",fmt(m.profit_factor,2)],["Net P/L",fmt(m.net_pl)],["Max drawdown",fmt(m.max_drawdown)],["Longest losing run",m.max_consecutive_losses]];
  return card(title, `<div class="rows">${rows.map(([k,v])=>`<span>${k}</span><span>${v}</span>`).join("")}</div><div class="verdict">${esc(m.verdict)}</div>`);
}
function propTable(){
  const a = S.prop_accounts||[];
  if(!a.length) return `<div class="empty">No account snapshots yet. Add one before each session to see your floors and the room you have left.</div>`;
  return `<div class="scroll"><table><tr><th>Account</th><th>Rules</th><th>Stage</th><th class="n">Equity</th><th class="n">Daily floor</th>
    <th class="n">Your stop</th><th class="n">Max floor</th><th class="n">Room left</th><th>Status</th></tr>
    ${a.map(x=>`<tr><td><b>${esc(x.account_label)}</b></td><td>${esc(x.preset)}</td><td>${esc(x.stage)}</td><td class="n">${fmt(x.equity)}</td>
    <td class="n">${fmt(x.daily_floor)}</td><td class="n">${fmt(x.internal_daily_stop)}</td><td class="n">${fmt(x.max_floor)}</td>
    <td class="n">${fmt(x.remaining_allowance)}</td><td><span class="pill ${esc(x.status)}">${esc(x.status||x.error)}</span></td></tr>`).join("")}</table></div>`;
}
const kv = (obj, labels) => `<div class="rows">${labels.map(([k,l,f])=>`<span>${l}</span><span>${(f||fmt)(obj[k])}</span>`).join("")}</div>`;
function banners(){
  let h = "";
  if(S.integrity && S.integrity.length) h += `<div class="banner bad"><b>Journal integrity:</b> ${S.integrity.map(esc).join(" ")}</div>`;
  if(S.validation && S.validation.length) h += `<div class="banner bad"><b>Check these trades:</b> ${S.validation.slice(0,4).map(esc).join("; ")}</div>`;
  (S.net_worth.warnings||[]).forEach(w => h += `<div class="banner bad">${esc(w)}</div>`);
  return h;
}
function recentTrades(n=8){
  const rows = (S._recent||[]).slice(0,n);
  if(!rows.length) return `<div class="empty">Nothing logged yet.</div>`;
  return `<div class="scroll"><table><tr><th>Date</th><th>Type</th><th>Instrument</th><th>Side</th><th>Setup</th><th class="n">Net</th><th class="n">R</th><th>Rules</th></tr>
    ${rows.map(r=>{ const R = parseFloat(r.r_multiple), P = parseFloat(r.net_pl); return `<tr><td>${esc((r.exit_time_utc||r.recorded_at_utc||"").slice(0,10))}</td><td>${esc(r.account_type)}</td><td>${esc(r.instrument)}</td>
    <td>${esc(r.direction)}</td><td>${esc(r.setup)}</td><td class="n ${sign(P)}">${esc(r.net_pl)}</td><td class="n ${sign(R)}">${isFinite(R)?R.toFixed(2):""}</td>
    <td>${r.rule_compliance==="VIOLATED"?'<span class="pill BREACHED">Violated</span>':'<span class="pill OK">Followed</span>'}</td></tr>`;}).join("")}</table></div>`;
}

// ---------------------------------------------------------------- views
const VIEWS = {
  overview(){
    const t = S.trades, pe = S.prop_economics, c = S.capital;
    return banners() + `<h1>Overview</h1><p class="lead">Live, prop and practice results are kept apart. Only payouts you have received count as cash.</p>` + kpis()
      + `<div class="grid">${metricsCard("Personal, live",t.personal.metrics)}${metricsCard("Prop accounts",t.prop.metrics)}${metricsCard("Practice: paper and demo",t.practice.metrics)}</div><br>`
      + card("Prop accounts today", propTable()) + "<br>"
      + `<div class="grid">${card("Prop firms, cash only", kv(pe,[["fees_paid_kes","Fees and resets paid",kes],["payouts_received_kes","Payouts received",kes],["fee_refunds_received","Fee refunds"],["payouts_pending_NOT_CASH","Pending, not cash",ccyList],["payouts_denied","Payouts denied"]]))}
        ${card("Personal capital", kv(c,[["deposits_kes","Deposited",kes],["withdrawals_kes","Withdrawn",kes],["current_equity","Latest statement equity"],["trading_pl_excluding_deposits","Trading P/L excluding deposits"],["time_weighted_return_pct","Time-weighted return %"]]))}
        ${card("Recent trades", recentTrades(5))}</div>
        <br><div class="card flat"><button class="btn sm" id="sync">↻ Sync paper trades</button> <a class="btn sm" href="/api/tracker/backup">Back up all records (.zip)</a>
        <span class="preview">&nbsp; Updated ${esc(new Date(S.generated_at).toLocaleString("en-GB"))}</span></div>`;
  },
  journal(){
    return banners() + `<h1>Journal</h1><p class="lead">Fill in the essentials; everything else is under More details. Saved trades can't be edited later; add a correction instead.</p>
      <div class="g2">${card("Log a trade", formHtml("trades",{button:"Save trade",preview:true}))}${card("Recent trades", recentTrades(12))}</div>
      <details class="sec"><summary>Missed trade</summary>${formHtml("missed")}</details>
      <details class="sec"><summary>Rule violation</summary>${formHtml("violations")}</details>
      <details class="sec"><summary>Correct a saved trade</summary>${formHtml("corrections",{button:"Save correction"})}</details>`;
  },
  prop(){
    const pe = S.prop_economics;
    return `<h1>Prop firms</h1><p class="lead">Add a snapshot before each session. The tracker applies that firm's own loss rules and your tighter internal stop.</p>`
      + card("Accounts today", propTable()) + `<br><div class="g2">${card("Account snapshot", formHtml("snapshots",{button:"Check and save"}))}
      ${card("Prop cash so far", kv(pe,[["fees_paid_kes","Fees and resets (KES)",kes],["payouts_received_kes","Payouts received (KES)",kes],["fees_paid_by_currency","Fees by currency",ccyList],["payouts_pending_NOT_CASH","Pending, not cash",ccyList],["effective_payout_ratio","Payouts ÷ fees"]]))}</div>
      <details class="sec"><summary>Record a purchase, reset or add-on</summary>${formHtml("evaluations",{button:"Save purchase"})}</details>
      <details class="sec"><summary>Record a payout</summary>${formHtml("payouts",{button:"Save payout"})}</details>`;
  },
  networth(){
    const nw = S.net_worth, assets = nw.lines.filter(l=>l.type==="ASSET" && l.kes_value>0), tot = assets.reduce((a,b)=>a+b.kes_value,0);
    const bar = tot>0 ? `<div class="alloc">${assets.map(l=>`<span title="${esc(l.item)}: ${kes(l.kes_value)}" style="width:${(l.kes_value/tot*100).toFixed(2)}%;background:${CAT_COL[l.category]||"#9CA3AF"}"></span>`).join("")}</div>
      <div class="legend">${Object.entries(nw.by_category).filter(([c,v])=>v>0).map(([c,v])=>`<span><i style="background:${CAT_COL[c]||"#9CA3AF"}"></i>${esc(c.replace(/_/g," ").toLowerCase())} ${pct(v/tot)}</span>`).join("")}</div>` : "";
    const items = nw.lines.length ? `<div class="scroll"><table><tr><th>Item</th><th>Category</th><th class="n">Amount</th><th>Ccy</th><th class="n">KES value</th><th>Liquid</th><th>As of</th><th>Source</th></tr>
      ${nw.lines.map(l=>`<tr><td><b>${esc(l.item)}</b></td><td>${esc((l.category||"").replace(/_/g," ").toLowerCase())}</td><td class="n">${fmt(l.amount)}</td><td>${esc(l.currency)}</td>
      <td class="n ${sign(l.kes_value)}">${kes(l.kes_value)}</td><td>${esc(l.liquid)}</td><td>${esc(l.date)}</td><td>${esc(l.source)}</td></tr>`).join("")}</table></div>`
      : `<div class="empty">No items yet. Start with cash, your emergency fund, investments and any debts. Broker accounts are added automatically from your monthly statements.</div>`;
    return banners() + `<h1>Net worth</h1><p class="lead">What you own minus what you owe, in KES. To update an item, enter the same name with today's value. Prop firm balances are never counted.</p>
      <div class="kpis">${kpi("Net worth", kes(nw.net_worth_kes), `Assets ${kes(nw.assets_kes)} · debts ${kes(nw.liabilities_kes)}`, "hero")}
      ${kpi("Liquid net worth", kes(nw.liquid_net_worth_kes), "Cash-like assets minus all debts")}
      ${kpi("In trading accounts", pct(nw.trading_share_of_net_worth), kes(nw.by_category.TRADING_ACCOUNT||0))}</div>
      <div class="g2">${card("Where it sits", bar + items)}${card("Add or update an item", formHtml("networth",{button:"Save item"}) + `<datalist id="nwitems">${nw.lines.map(l=>`<option value="${esc(l.item)}">`).join("")}</datalist>`)}</div>`;
  },
  capital(){
    return banners() + `<h1>Capital</h1><p class="lead">Money moving in and out of your own trading accounts, valued in KES at the rate you actually got.</p>
      <div class="g2">${card("Deposit", formHtml("deposits",{button:"Save deposit"}))}${card("Withdrawal", formHtml("withdrawals",{button:"Save withdrawal"}))}</div>
      <details class="sec"><summary>Monthly reconciliation</summary>${formHtml("reconciliation",{button:"Save month"})}</details>
      <details class="sec"><summary>Broker accounts</summary>${formHtml("accounts",{button:"Save account"})}</details>`;
  },
  psych(){ return `<h1>Psychology</h1><p class="lead">One entry per trading day. Patterns show up after a few weeks.</p>` + card("Today", formHtml("psychology",{button:"Save entry"})); },
  tools(){
    const presets = Object.entries(S.presets).map(([k,p])=>`<option value="${esc(k)}">${esc(p.firm)} · ${esc(p.programme)}</option>`).join("");
    const L = (n, l, v="", req) => `<label><span>${l}${req?' <b class="star">*</b>':""}</span><input name="${n}" type="number" step="any" inputmode="decimal" value="${v}"></label>`;
    return `<h1>Tools</h1><p class="lead">Calculators only. Nothing here places or changes an order.</p><div class="g2">
      ${card("Position size", `<form class="f" id="sizeF">${L("equity","Equity","",1)}${L("risk_pct","Risk %","0.5",1)}
        <label><span>Symbol</span><select name="symbol"><option>XAUUSD</option><option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>US100</option></select></label>
        ${L("entry","Entry","",1)}${L("stop","Stop","",1)}${L("spread","Spread (price)","0.30")}${L("slippage","Slippage (price)","0.10")}${L("commission","Commission per lot")}${L("rate","Quote to account rate")}
        <label><span>Account</span><select name="kind"><option value="personal">Personal</option><option value="prop">Prop</option></select></label>
        <div class="formfoot"><button class="btn pri">Calculate</button></div></form><div class="rows" id="sizeOut" style="margin-top:14px"></div>`, "Rounds down and includes spread, slippage and commission.")}
      ${card("Prop drawdown check", `<form class="f" id="ddF"><label><span>Rules <b class="star">*</b></span><select name="preset">${presets}</select></label>
        ${L("initial","Initial balance","",1)}${L("equity","Equity now","",1)}${L("day_start_balance","Day start balance","",1)}${L("highest_eod_balance","Highest end-of-day balance")}
        <div class="formfoot"><button class="btn pri">Check</button></div></form><div class="rows" id="ddOut" style="margin-top:14px"></div>`, "Uses the firm's own method and your internal stop.")}</div>`;
  },
  records(){
    return `<h1>Records</h1><p class="lead">Every saved row, newest first. Export any table to CSV, or download the full Excel workbook from the top bar.</p>
      <div class="card"><form id="recF" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><label style="min-width:220px"><span>Record type</span><select name="kind">${Object.keys(FORMS).map(k=>`<option>${k}</option>`).join("")}</select></label>
      <button class="btn">Show</button><a class="btn" id="exp" href="/api/tracker/export?kind=trades">Export CSV</a></form><div id="recOut" style="margin-top:14px"></div></div>`;
  },
};

async function calc(form, path, outId){
  const body = Object.fromEntries([...new FormData(form)].filter(([,v])=>v!=="")), out = document.getElementById(outId);
  const r = await api(path, body);
  if(!r.ok){ out.innerHTML = ""; toast(r.error, true); return; }
  const skip = ["source","notes","warnings","reasons","preset"];
  out.innerHTML = Object.entries(r.result).filter(([k])=>!skip.includes(k)).map(([k,v])=>`<span>${esc(k.replace(/_/g," "))}</span><span>${k==="status"?`<span class="pill ${esc(v)}">${esc(v)}</span>`:typeof v==="boolean"?(v?"yes":"no"):fmt(v,4)}</span>`).join("")
    + [...(r.result.warnings||[]), ...(r.result.reasons||[])].map(w=>`<span class="neg" style="grid-column:1/-1;text-align:left">${esc(w)}</span>`).join("");
}
async function showRecords(kind){
  const r = await api(`/api/tracker/records?kind=${encodeURIComponent(kind)}&limit=300`), out = document.getElementById("recOut");
  document.getElementById("exp").href = `/api/tracker/export?kind=${encodeURIComponent(kind)}`;
  if(r.ok===false){ out.innerHTML = `<div class="banner bad">${esc(r.error)}</div>`; return; }
  out.innerHTML = r.total ? `<p class="preview" style="margin-bottom:8px">${r.total} rows</p><div class="scroll"><table><tr>${r.header.map(h=>`<th>${esc(h.replace(/_/g," "))}</th>`).join("")}</tr>
    ${r.rows.map(row=>`<tr>${r.header.map(h=>`<td>${esc(row[h])}</td>`).join("")}</tr>`).join("")}</table></div>` : `<div class="empty">No ${esc(kind)} records yet.</div>`;
}

function render(){
  if(!S || S.ok===false){ document.getElementById("app").innerHTML = `<div class="banner bad">${esc((S&&S.error)||"Tracker unavailable")}</div>`; return; }
  document.getElementById("tabs").innerHTML = TABS.map(([k,l])=>`<button type="button" data-t="${k}" class="${k===tab?"on":""}">${l}</button>`).join("");
  document.getElementById("app").innerHTML = (VIEWS[tab]||VIEWS.overview)();
  document.querySelectorAll("form.f[data-kind]").forEach(f=>{
    f.addEventListener("submit", submitForm);
    if(f.dataset.kind==="trades") f.addEventListener("input", ()=>tradePreview(f));
    if(f.dataset.kind==="networth"){
      const it = f.elements.item;
      it.addEventListener("change", ()=>{ const l = S.net_worth.lines.find(x=>(x.item||"").toLowerCase()===it.value.toLowerCase());
        if(l){ f.elements.category.value = l.category; f.elements.currency.value = l.currency; if(l.fx_rate_to_kes) f.elements.fx_rate_to_kes.value = l.fx_rate_to_kes; f.elements.liquid.value = l.liquid; } });
      f.elements.currency.addEventListener("change", ()=>{ f.elements.fx_rate_to_kes.value = f.elements.currency.value==="KES" ? "1" : ""; });
    }
  });
  const s = document.getElementById("sync"); if(s) s.onclick = async()=>{ s.disabled = true; const r = await api("/api/tracker/sync_paper",{}); toast(`Synced ${r.added||0} new paper trades`); await load(); };
  const sz = document.getElementById("sizeF"); if(sz) sz.onsubmit = e=>{e.preventDefault(); calc(sz,"/api/tracker/size","sizeOut");};
  const dd = document.getElementById("ddF"); if(dd) dd.onsubmit = e=>{e.preventDefault(); calc(dd,"/api/tracker/drawdown","ddOut");};
  const rf = document.getElementById("recF"); if(rf){ rf.onsubmit = e=>{e.preventDefault(); showRecords(rf.elements.kind.value);}; showRecords("trades"); }
}
document.getElementById("tabs").addEventListener("click", e=>{ const t = e.target.dataset.t; if(t){ tab = t; location.hash = t; render(); window.scrollTo(0,0); }});
load();
</script>
</body></html>
