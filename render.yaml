services:
  - type: web
    name: signal-desk
    runtime: python
    branch: master
    repo: https://github.com/givondo/signal-desk
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: python xauusd_trader.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SIGNALDESK_USER
        value: trader
      - key: SIGNALDESK_PASS
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
